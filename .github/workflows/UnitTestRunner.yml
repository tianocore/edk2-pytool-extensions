on:
  workflow_call:
    inputs:
      python-versions:
        description: 'Python Versions to use for Unit Tests. A Matrix is created from this'
        required: true
        type: string

jobs:
  run:
    name: Run

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        python-version: ${{ fromJson(inputs.python-versions) }}
        os: [ubuntu-latest, windows-latest]
    
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install pip Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade -e .[dev]
    
    - name: Install Mono and certificates
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update --error-on=any
        if ! apt-cache show ca-certificates-mono > /dev/null 2>&1; then
          sudo apt-get install -y ca-certificates gnupg
          sudo gpg --batch --homedir /tmp --no-default-keyring --keyring gnupg-ring:/usr/share/keyrings/mono-official-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys 3FA7E0328081BFF6A14DA29AA6A19B38D3D831EF
          sudo chmod +r /usr/share/keyrings/mono-official-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/mono-official-archive-keyring.gpg] https://download.mono-project.com/repo/ubuntu stable-focal main" | sudo tee /etc/apt/sources.list.d/mono-official-stable.list
          sudo apt-get update --error-on=any
        fi
        sudo apt-get install -y mono-devel ca-certificates-mono
    
    - name: Run Unit Tests
      run: coverage run -m pytest

    - name: Format Coverage results
      run: coverage xml

    - name: Upload coverage to codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true
    
    - uses: actions/upload-artifact@v7
      with:
        name: Artifacts-${{matrix.os}}-${{matrix.python-version}}
        path: |
          pytest_report.html
          test.junit.xml
      if: failure()
